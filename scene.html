// посылка со стрелкой «скачано»
function drawParcel(x, bottom, s, t) {
  drawBox(x, bottom, s);
  ctx.save();
  ctx.fillStyle = '#7fd8a8'; ctx.font = `700 ${s * 0.55}px "Segoe UI Symbol", "Segoe UI", sans-serif`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('⬇', x, bottom - s * 0.5 + Math.sin(t * 6) * s * 0.04);
  ctx.restore();
}

// будильник на полу, трясётся и звенит
function drawAlarm(x, g, pw, t) {
  ctx.save();
  ctx.translate(x, g - 4.6 * pw); ctx.rotate(Math.sin(t * 40) * 0.12);
  ctx.fillStyle = '#ffc46b';
  for (const s of [-1, 1]) { ctx.beginPath(); ctx.arc(s * 2.6 * pw, -3.3 * pw, 1.4 * pw, Math.PI, 0); ctx.fill(); }
  ctx.fillStyle = '#ff8a6a'; ctx.beginPath(); ctx.arc(0, 0, 3.6 * pw, 0, 6.29); ctx.fill();
  ctx.fillStyle = '#fff6ec'; ctx.beginPath(); ctx.arc(0, 0, 2.7 * pw, 0, 6.29); ctx.fill();
  ctx.strokeStyle = '#3b1a10'; ctx.lineWidth = pw * 0.45; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, -1.9 * pw); ctx.moveTo(0, 0); ctx.lineTo(1.3 * pw, 0.6 * pw); ctx.stroke();
  ctx.fillStyle = '#ff8a6a'; ctx.fillRect(-2.6 * pw, 3.1 * pw, pw, 1.4 * pw); ctx.fillRect(1.6 * pw, 3.1 * pw, pw, 1.4 * pw);
  ctx.restore();
  if (Math.sin(t * 9) > 0) {
    ctx.save(); ctx.strokeStyle = 'rgba(255,220,160,.85)'; ctx.lineWidth = pw * 0.4; ctx.lineCap = 'round';
    for (const s of [-1, 1]) {
      ctx.beginPath();
      ctx.moveTo(x + s * 5 * pw, g - 8.5 * pw); ctx.lineTo(x + s * 6.6 * pw, g - 10 * pw);
      ctx.moveTo(x + s * 5.4 * pw, g - 6.2 * pw); ctx.lineTo(x + s * 7.3 * pw, g - 6.6 * pw);
      ctx.stroke();
    }
    ctx.restore();
  }
}

function drawParts(dt) {
  M.parts = M.parts.filter(q => (q.life -= dt) > 0);
  for (const q of M.parts) {
    q.vy += q.g * dt; q.x += q.vx * dt; q.y += q.vy * dt;
    const a = Math.min(1, q.life / (q.max * 0.5));
    if (q.kind === 'txt') {
      const sz = q.grow ? q.size * (1 + (1 - q.life / q.max) * 1.2) : q.size;
      ctx.font = `600 ${sz}px "Cascadia Mono", Consolas, monospace`; ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
      ctx.fillStyle = `rgba(${q.col},${a * 0.9})`; ctx.fillText(q.text, q.x, q.y);
    } else if (q.kind === 'bubble') {            // мыльный пузырь: переливается и лопается
      const s = q.size * (1 + (1 - q.life / q.max) * 0.4), bx = q.x + Math.sin(q.life * 3 + q.ph) * s * 0.6;
      ctx.strokeStyle = `rgba(${q.col},${a * 0.85})`; ctx.lineWidth = Math.max(1, s * 0.14);
      ctx.beginPath(); ctx.arc(bx, q.y, s, 0, 6.29); ctx.stroke();
      ctx.fillStyle = `rgba(${q.col},${a * 0.12})`; ctx.fill();
      ctx.fillStyle = `rgba(255,255,255,${a * 0.6})`; ctx.fillRect(bx - s * 0.5, q.y - s * 0.55, s * 0.3, s * 0.3);
      if (q.life < 0.06 && !q.popped) { q.popped = true; M.parts.push({ kind: 'txt', text: '·', x: bx, y: q.y, vx: 0, vy: -s, g: 0, life: 0.3, max: 0.3, size: s * 2, col: q.col }); }
    } else if (q.kind === 'leaf') {
      q.rot = (q.rot || 0) + dt * (q.spin || 3); q.vx *= Math.pow(0.4, dt);
      ctx.save(); ctx.translate(q.x, q.y); ctx.rotate(q.rot); ctx.globalAlpha = a;
      ctx.fillStyle = q.col; ctx.beginPath(); ctx.ellipse(0, 0, q.size, q.size * 0.55, 0, 0, 6.29); ctx.fill();
      ctx.restore();
    } else if (q.kind === 'flash') {
      const gl = ctx.createRadialGradient(q.x, q.y, 0, q.x, q.y, q.size);
      gl.addColorStop(0, `rgba(255,255,255,${a * 0.9})`); gl.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.fillStyle = gl; ctx.beginPath(); ctx.arc(q.x, q.y, q.size, 0, 6.29); ctx.fill();
    } else if (q.kind === 'pola') {             // полароид с кусочком неба
      q.rot = (q.rot || 0) + dt * q.spin;
      ctx.save(); ctx.translate(q.x, q.y); ctx.rotate(q.rot); ctx.globalAlpha = a;
      ctx.fillStyle = '#f6f1e8'; ctx.fillRect(-q.size / 2, -q.size / 2, q.size, q.size * 1.15);
      const gr = ctx.createLinearGradient(0, -q.size / 2, 0, q.size * 0.4); gr.addColorStop(0, '#5a3a6a'); gr.addColorStop(1, '#ff9a6a');
      ctx.fillStyle = gr; ctx.fillRect(-q.size * 0.4, -q.size * 0.4, q.size * 0.8, q.size * 0.75);
      ctx.restore();
    } else if (q.kind === 'smoke') {
      const s = q.size * (1 + (1 - q.life / q.max) * 1.6);
      ctx.fillStyle = `rgba(${q.col},${a * 0.32})`;
      ctx.beginPath(); ctx.arc(q.x, q.y, s, 0, 6.29); ctx.fill();
    } else if (q.kind === 'heart') {
      const s = q.size;
      ctx.fillStyle = `rgba(${q.col},${a})`;
      ctx.beginPath();
      ctx.moveTo(q.x, q.y + s * 0.9);
      ctx.bezierCurveTo(q.x - s * 1.4, q.y - s * 0.1, q.x - s * 0.6, q.y - s * 1.1, q.x, q.y - s * 0.35);
      ctx.bezierCurveTo(q.x + s * 0.6, q.y - s * 1.1, q.x + s * 1.4, q.y - s * 0.1, q.x, q.y + s * 0.9);
      ctx.fill();
    } else {
      const s = q.size;
      ctx.fillStyle = `rgba(${q.col},${a})`;
      ctx.beginPath();
      ctx.moveTo(q.x, q.y - s); ctx.quadraticCurveTo(q.x, q.y, q.x + s, q.y); ctx.quadraticCurveTo(q.x, q.y, q.x, q.y + s);
      ctx.quadraticCurveTo(q.x, q.y, q.x - s, q.y); ctx.quadraticCurveTo(q.x, q.y, q.x, q.y - s); ctx.fill();
    }
  }
}

function drawBubble(dt, headY, r) {
  const bb = M.bubble; if (!bb) return;
  bb.t += dt;
  if (bb.t > bb.dur) { M.bubble = null; return; }
  const pop = backOut(Math.min(1, bb.t / 0.28)), fade = Math.min(1, (bb.dur - bb.t) / 0.3);
  ctx.save();
  ctx.font = `600 ${r * 0.62}px "Segoe UI Variable Text", "Segoe UI", sans-serif`;
  const tw = ctx.measureText(bb.text).width, bw = tw + r * 0.9, bh = r * 1.05;
  let bx = M.x + M.facing * r * 0.6;
  bx = Math.min(Math.max(bx, feedBox.left + bw / 2), feedBox.right - bw / 2);
  const by = headY - bh / 2 - r * 0.3;
  ctx.globalAlpha = fade;
  ctx.translate(bx, by + bh / 2); ctx.scale(pop, pop); ctx.translate(-bx, -(by + bh / 2));
  ctx.fillStyle = 'rgba(255,248,240,0.94)';
  ctx.beginPath(); ctx.roundRect(bx - bw / 2, by - bh / 2, bw, bh, bh / 2); ctx.fill();
  const tx = Math.min(Math.max(M.x, bx - bw / 2 + r * 0.4), bx + bw / 2 - r * 0.4);
  ctx.beginPath(); ctx.moveTo(tx - r * 0.18, by + bh / 2 - 1); ctx.lineTo(tx + r * 0.18, by + bh / 2 - 1); ctx.lineTo(tx, by + bh / 2 + r * 0.3); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#3b1a10'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(bb.text, bx, by + r * 0.03);
  ctx.restore();
}
