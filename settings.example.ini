# Lofi Desk settings — copy this file to settings.ini (install.ps1 does it for you).
# Changes apply after "Restart wallpaper" in the tray menu.

# interface language: en | ru
lang=en

# scene: lofi (rainy window, cat, city lights) | art (your own picture with gentle camera motion, clouds, birds)
scene=lofi
# picture for the art scene, relative to this folder (put it into art/)
art=art/art.jpg

# 1 = show the Claude Code activity feed and the mascot, 0 = just the scene
feed=1

# film grain over the scene: 1 = on, 0 = off
grain=1

# weather from Open-Meteo (no API key). Leave lat/lon empty to hide the weather widget.
city=Lisbon
lat=38.72
lon=-9.14

# show your Claude plan limits in the feed header.
#   - Claude Code in a terminal: add statusline.ps1 as your statusLine (see README) — works out of the box.
#   - limits=1 additionally reads the 5-hour window from the Claude desktop app's local cache.
#     This is undocumented and may break with app updates, so it is off by default.
limits=0
